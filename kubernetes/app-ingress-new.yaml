apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: votehub-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: votehub-new.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votehub
                port:
                  number: 5000
